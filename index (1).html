function save(){try{localStorage.setItem('homefit_v2',JSON.stringify(data))}catch{notify('储存空间不足，请先备份资料')}}
function saveSession(){try{if(session)localStorage.setItem('homefit_v3_active',JSON.stringify(session));else localStorage.removeItem('homefit_v3_active')}catch{}}
function notify(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.style.display='none',2800)}
function percent(n,d){return d>0?Math.max(0,Math.min(100,Math.round(n/d*100))):0}
function progress(n,d){return `<div class="bar"><span style="width:${percent(n,d)}%"></span></div>`}
function img(id,heightClass=''){return `<div class="photoFrame ${heightClass}">${IMAGES[id]?`<img class="photo" src="${IMAGES[id]}" alt="${esc(E[id]?.[0]||'训练')} 静态概念照片" loading="lazy">`:`<div class="noPhoto"><b>⌁</b><span>动作照片未配置</span></div>`}</div>`}
function weeklyWorkouts(){let d=new Date(),wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);d.setHours(0,0,0,0);return data.workouts.filter(w=>new Date(w.date+'T12:00:00')>=d)}
function todayFood(){return data.food.filter(x=>x.date===foodDate)}
function todayProtein(){return data.food.filter(x=>x.date===dateToday()).reduce((a,f)=>a+(Number(f.protein)||0),0)}
function currentProtein(){return todayFood().reduce((a,f)=>a+(Number(f.protein)||0),0)}
function currentCals(){return todayFood().reduce((a,f)=>a+(Number(f.calories)||0),0)}
function nav(){const navs=[['train','◈','训练'],['library','▦','动作库'],['food','♨','饮食'],['feedback','▥','反馈'],['profile','☷','我的']];$('nav').innerHTML=navs.map(([id,i,n])=>`<button class="${page===id?'active':''}" onclick="goto('${id}')"><span class="ico">${i}</span>${n}</button>`).join('')}
function goto(p){if(timerId)stopRest();page=p;detailId=null;render();window.scrollTo(0,0)}
function render(){nav();$('app').innerHTML=detailId?detailView():({train:training,library:library,food:food,feedback:feedback,profile:profile})[page]();}
function training(){if(session)return sessionView();const p=plans[mode][focus],wk=weeklyWorkouts().length;return `<section class="card hero"><div class="eyebrow">TODAY'S WORKOUT</div><h1 style="margin-top:9px">练出自己的节奏<span style="color:var(--blue)">.</span></h1><p class="muted small">每次15–30分钟 · 居家与健身房自由切换</p><div class="row"><span class="pill">⚡ 本周完成 ${wk} 次</span><span class="pill">蛋白质 ${todayProtein().toFixed(0)} / ${data.proteinTarget}g</span></div></section><div class="sectionhead"><h2>训练环境</h2><span class="muted small">选择你今天在哪里练</span></div><div class="pillTabs"><button class="${mode==='home'?'active':''}" onclick="changeMode('home')">⌂ 居家训练</button><button class="${mode==='gym'?'active':''}" onclick="changeMode('gym')">▣ 健身房器械</button></div><div class="sectionhead"><h2>训练目标</h2></div><div class="pillTabs">${[['full','全身'],['upper','上半身增肌'],['lower','下半身维持']].map(([v,t])=>`<button class="${focus===v?'active':''}" onclick="changeFocus('${v}')">${t}</button>`).join('')}</div><div class="sectionhead"><h2>目标时长</h2><span class="muted small">热身时间另外计算</span></div><div class="pillTabs"><button class="${minutes===15?'active':''}" onclick="setMinutes(15)">15分钟 · 快速</button><button class="${minutes===30?'active':''}" onclick="setMinutes(30)">30分钟 · 完整</button></div><div class="sectionhead"><h2>今天的动作</h2><span class="pill">${p.length} 个动作</span></div>${p.map((id,i)=>exerciseCard(id,i+1)).join('')}<p class="small muted" style="line-height:1.6;margin:14px 1px">训练图片仅为视觉参考，不是经过逐帧认证的教学视频；实际训练请以文字要点、个人关节活动度与安全负重为准。</p><button class="btn blue full" style="padding:17px" onclick="startSession()">开始今天的训练　→</button>`}
function changeMode(v){mode=v;data.mode=v;save();render()};function changeFocus(v){focus=v;render()};function setMinutes(v){minutes=v;render()}
function exerciseCard(id,num,click=`openDetail('${id}')`){const e=E[id];return `<button class="workCard" onclick="${click}">${img(id,'thumb')}<div style="flex:1;min-width:0"><div class="name">${num?num+'. ':''}${esc(e[0])}</div><div class="en">${esc(e[1])}</div><div class="tags"><span class="tag">${e[2]}</span><span class="tag">${e[4]}</span></div></div><div class="arrow">›</div></button>`}
function openDetail(id){detailId=id;render();window.scrollTo(0,0)}
function detailView(){const e=E[detailId];return `<div class="row" style="justify-content:flex-start;margin-bottom:13px"><button class="back" onclick="detailId=null;render()">‹</button><div><h2 style="margin:0">${esc(e[0])}</h2><div class="muted small">${esc(e[1])}</div></div></div>${photoHero(detailId)}<div class="card"><div class="row"><span class="pill">${e[2]}</span><span class="pill">${e[4]}</span></div><h2 style="margin-top:16px">动作步骤</h2>${technique(e)}<div class="hint" style="margin-top:13px">静态概念照片不是动作认证示范。初次接触的动作建议请教合格教练确认姿势。</div></div><div class="sectionhead"><h2>替代动作</h2></div>${(alt[detailId]||[]).filter(x=>E[x]).map(x=>exerciseCard(x,0)).join('')||'<div class="muted small">暂无替代选项</div>'}<button class="btn full" onclick="detailId=null;render()">← 返回</button>`}
function technique(e){return `<div class="steps">${e[5].map((s,i)=>`<div class="step"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(s)}</span></div>`).join('')}</div>`}
function photoHero(id){return `<div style="position:relative">${img(id,'bigPhoto')}<span class="floatingBadge">静态动作参考 · ${esc(E[id][3])}</span></div>`}
function startSession(){session={mode,focus,minutes,plan:[...plans[mode][focus]],index:0,set:1,log:[],chosen:{},started:Date.now()};saveSession();render();window.scrollTo(0,0)}
function activeId(){return session.chosen[session.index]||session.plan[session.index]}
function sessionView(){const id=activeId(),e=E[id],sets=session.minutes===15?2:3,done=session.index*sets+session.set-1,total=session.plan.length*sets;let last=data.logs[id]||{};return `<div class="row" style="margin-bottom:10px"><button class="back" onclick="exitSession()">‹</button><span class="pill">${session.mode==='home'?'居家':'健身房'} · 第 ${session.index+1}/${session.plan.length} 个动作</span><span class="muted small">${done}/${total} 组</span></div>${progress(done,total)}<h1 style="margin-top:20px">${esc(e[0])}</h1><div class="small muted" style="margin-top:-7px;margin-bottom:14px">${esc(e[1])} · ${e[2]}</div>${photoHero(id)}<div class="pillTabs"><button class="active" disabled>动作参考</button><button onclick="openDetail('${id}')">动作步骤与要点 ›</button></div><div class="card"><div class="row"><h3 style="margin:0">动作选项</h3><span class="muted small">更换后自动更新名称和参考资料</span></div><div class="pillTabs">${[session.plan[session.index],...(alt[session.plan[session.index]]||[])].filter(x=>E[x]).map(x=>`<button class="${id===x?'active':''}" onclick="chooseAlternative('${x}')">${esc(E[x][0])}</button>`).join('')}</div><div class="row" style="margin-top:4px"><span class="pill">建议 ${esc(e[4])}</span><span class="small muted">第 ${session.set} / ${sets} 组</span></div><div class="bigInputs"><div><label>重量（kg）</label><div class="numberctrl"><button onclick="adjust('weight',-2.5)">−</button><input id="weight" aria-label="重量公斤" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(last.weight??0)}"><button onclick="adjust('weight',2.5)">+</button></div></div><div><label>次数（reps）</label><div class="numberctrl"><button onclick="adjust('reps',-1)">−</button><input id="reps" aria-label="动作次数" type="number" inputmode="numeric" min="0" step="1" value="${esc(last.reps??10)}"><button onclick="adjust('reps',1)">+</button></div></div></div><button class="btn blue full" onclick="completeSet()">☑ 完成这一组</button></div><div class="card" style="text-align:center"><h2 style="margin:2px">休息 60 秒</h2><div class="timerRing" id="timerRing"><span class="seconds" id="seconds">${restActive?(seconds===0?'GO':seconds):60}</span><small>秒</small></div><div class="row"><button class="btn green" style="flex:1" onclick="startRest()">▶ 开始休息</button><button class="btn" onclick="stopRest()">重置</button></div><p class="small muted" style="margin:12px 0 0">动作不倒计时，休息由你手动开始。</p></div><button class="btn outline full" onclick="exitSession()">结束本次训练</button>`}
function adjust(id,amount){const el=$(id);let v=Number(el.value)||0;el.value=Math.max(0,Math.round((v+amount)*10)/10)}
function chooseAlternative(id){session.chosen[session.index]=id;saveSession();stopRest();render()}
function completeSet(){const id=activeId(),weight=Number($('weight').value),reps=Number($('reps').value),sets=session.minutes===15?2:3;if(!Number.isFinite(weight)||weight<0||!Number.isFinite(reps)||reps<=0||!Number.isInteger(reps)){notify('请填写有效重量和次数');return}const rec={date:dateToday(),id,exercise:E[id][0],weight,reps,set:session.set};session.log.push(rec);data.logs[id]={weight,reps};save();if(session.set<sets){session.set++}else if(session.index<session.plan.length-1){session.index++;session.set=1}else{data.workouts.push({date:dateToday(),mode:session.mode,type:session.focus,sets:session.log.length,details:session.log,duration:Math.max(1,Math.round((Date.now()-session.started)/60000))});save();session=null;saveSession();stopRest();notify('训练已完成，记录已保存！');page='feedback';render();return}saveSession();stopRest();render();notify('这一组已保存。休息时请手动开始计时。');window.scrollTo(0,0)}
function exitSession(){if(!confirm('结束当前训练？已完成的组数还未计入历史，建议先完成训练。'))return;session=null;saveSession();stopRest();render()}
function startRest(){stopRest();restActive=true;seconds=60;updateRest();timerId=setInterval(()=>{seconds--;updateRest();if(seconds<=0){clearInterval(timerId);timerId=null;restActive=false;notify('GO！继续下一组');if(navigator.vibrate)navigator.vibrate([150,80,150])}},1000)}
function updateRest(){const e=$('seconds');if(e)e.textContent=seconds===0?'GO':seconds;const r=$('timerRing');if(r)r.style.borderColor=seconds===0?'var(--green)':'#4e93f6'}
function stopRest(){if(timerId)clearInterval(timerId);timerId=null;seconds=60;restActive=false;updateRest()}
function library(){const vals=Object.entries(E).filter(([id,e])=>(category==='全部'||e[2]===category)&&(!search||(`${e[0]} ${e[1]} ${e[3]}`.toLowerCase().includes(search.toLowerCase()))));return `<div class="eyebrow">EXERCISE LIBRARY</div><h1 style="margin:8px 0 7px">动作库</h1><p class="small muted">${Object.keys(E).length} 个动作 · 居家与健身房</p><input class="input" placeholder="搜索动作名称或器材" value="${esc(search)}" oninput="search=this.value;filterLibrary()" id="searchInput"><div class="pillTabs">${['全部','胸部','背部','腿臀','肩部','手臂','核心'].map(x=>`<button class="${category===x?'active':''}" onclick="setCategory('${x}')">${x}</button>`).join('')}</div><div id="libraryResults">${vals.map(([id])=>exerciseCard(id,0)).join('')||'<div class="empty">没有找到动作，试试其他关键字</div>'}</div>`}
function filterLibrary(){const vals=Object.entries(E).filter(([id,e])=>(category==='全部'||e[2]===category)&&(`${e[0]} ${e[1]} ${e[3]}`.toLowerCase().includes(search.toLowerCase())));$('libraryResults').innerHTML=vals.map(([id])=>exerciseCard(id,0)).join('')||'<div class="empty">没有找到动作</div>'}
function setCategory(v){category=v;render()}
function food(){let f=currentProtein(),items=todayFood();return `<div class="eyebrow">NUTRITION TRACKER</div><h1 style="margin:8px 0">饮食与营养</h1><section class="card hero"><div class="row"><div><div class="small muted">所选日期蛋白质</div><div class="kpi">${f.toFixed(1)} <span style="font-size:14px;font-weight:500;color:var(--muted)">/ ${data.proteinTarget} g</span></div></div><div class="pill">${percent(f,data.proteinTarget)}%</div></div>${progress(f,data.proteinTarget)}<div class="row small"><span>还差 ${Math.max(0,data.proteinTarget-f).toFixed(1)} g</span><span class="muted">${currentCals().toFixed(0)} kcal 已记录</span></div></section><div class="card"><label class="field">选择记录日期</label><input type="date" class="input" value="${esc(foodDate)}" onchange="foodDate=this.value;render()"><h2 style="margin:18px 0 6px">记录一餐</h2><p class="muted small">手动填写，不使用拍照或 AI 计算。</p><label class="field">食物名称</label><input id="fname" class="input" placeholder="例如：鸡胸肉、虾、豆腐"><div class="grid2"><div><label class="field">食物重量（g）</label><input type="number" class="input" id="fgrams" min="1" placeholder="150" oninput="calcFood()"></div><div><label class="field">生熟状态</label><select id="fstate"><option value="raw">生重</option><option value="cooked">熟重</option></select></div><div><label class="field">蛋白质 / 100g</label><input type="number" id="fp100" class="input" step="0.1" placeholder="例如 23" oninput="calcFood()"></div><div><label class="field">热量 / 100g</label><input type="number" id="fc100" class="input" step="0.1" placeholder="例如 120" oninput="calcFood()"></div></div><div class="row" style="margin:14px 0"><span class="small" id="foodPreview">蛋白质 0g · 热量 0kcal</span></div><button class="btn blue full" onclick="addFood()">＋ 记录这份食物</button><p class="small muted" style="line-height:1.6;margin:12px 0 0">请根据营养标签或可靠资料输入生重或熟重对应的每100g营养值。</p></div><div class="sectionhead"><h2>${esc(foodDate)} · 饮食记录</h2><span class="pill">${items.length} 笔</span></div><div class="card">${items.length?items.map(x=>`<div class="listRow row"><div><b>${esc(x.name)}</b><div class="small muted">${Number(x.grams).toFixed(0)}g · ${x.state==='raw'?'生重':'熟重'} · ${Number(x.calories||0).toFixed(0)} kcal</div></div><div class="rowleft"><b style="color:#7fb9ff">${Number(x.protein||0).toFixed(1)}g</b><button class="smButton" onclick="removeFood(${JSON.stringify(x.id)})">删除</button></div></div>`).join(''):'<div class="empty">这一天还没有饮食记录</div>'}</div>`}
function calcFood(){const g=Number($('fgrams').value)||0,p=Number($('fp100').value)||0,c=Number($('fc100').value)||0;$('foodPreview').textContent=`蛋白质 ${(g*p/100).toFixed(1)}g · 热量 ${(g*c/100).toFixed(0)}kcal`}
function addFood(){const name=$('fname').value.trim(),grams=Number($('fgrams').value),p=Number($('fp100').value),c=Number($('fc100').value);if(!name||grams<=0||!$('fp100').value||!$('fc100').value||p<0||c<0){notify('请填写食物名称、重量和营养信息');return}data.food.push({id:Date.now(),date:foodDate,name,grams,state:$('fstate').value,protein:grams*p/100,calories:grams*c/100});save();render();notify('已加入饮食记录')}
function removeFood(id){if(!confirm('删除这笔饮食记录？'))return;data.food=data.food.filter(x=>x.id!==id);save();render()}
function feedback(){const w=weeklyWorkouts(),target=(data.trainingDays||[]).length||4,total=data.workouts.length,latest=data.workouts.slice(-8).reverse(),latestMeasure=data.measurements.at(-1);return `<div class="eyebrow">WEEKLY PROGRESS</div><h1 style="margin:8px 0">训练反馈</h1><section class="card hero"><div class="row"><div><div class="small muted">本周完成率</div><div class="kpi">${percent(w.length,target)}%</div></div><div class="pill">${w.length} / ${target} 天</div></div>${progress(w.length,target)}<p class="small muted" style="margin:10px 0 0">居家和健身房的训练次数合并计算。</p></section><div class="grid2"><div class="subcard statCard"><div class="small muted">累计训练</div><div class="big">${total} <span class="small">次</span></div></div><div class="subcard statCard"><div class="small muted">今日蛋白质</div><div class="big">${todayProtein().toFixed(0)} <span class="small">g</span></div></div></div><div class="sectionhead"><h2>最近训练</h2></div><div class="card">${latest.length?latest.map(x=>`<div class="listRow"><div class="row"><b>${esc(x.date)}</b><span class="pill">${x.mode==='gym'?'健身房':'居家'} · ${x.sets||0} 组</span></div><div class="small muted" style="margin-top:6px">${esc((x.details||[]).slice(0,3).map(d=>d.exercise||d.name||'动作').join(' · '))||'训练已完成'}${(x.details||[]).length>3?' · …':''}</div></div>`).join(''):'<div class="empty">还没有完成的训练。开始第一堂吧！</div>'}</div><div class="sectionhead"><h2>身体进度</h2><button class="smButton" onclick="goto('profile')">新增测量 ›</button></div><div class="card"><div class="row"><span class="muted">最新体重</span><b>${latestMeasure?.weight?latestMeasure.weight+' kg':'未记录'}</b></div></div><div class="hint">力量反馈以每次记录的重量和次数为基础；如果刚恢复运动，先观察趋势，不必急着挑战历史巅峰重量。</div>`}
function profile(){return `<div class="eyebrow">YOUR FITNESS PROFILE</div><h1 style="margin:8px 0">我的数据</h1><div class="card"><h2>身体围度</h2><div class="grid2">${[['weight','体重（kg）'],['chest','胸围（cm）'],['waist','腰围（cm）'],['arm','手臂（cm）'],['hip','臀围（cm）'],['thigh','大腿（cm）']].map(([id,n])=>`<div><label class="field">${n}</label><input class="input" type="number" step="0.1" id="m_${id}" placeholder="可留空"></div>`).join('')}</div><button class="btn blue full" style="margin-top:15px" onclick="addMeasure()">保存今日测量</button></div><div class="card"><h2>身体记录</h2>${data.measurements.length?data.measurements.slice(-5).reverse().map(m=>`<div class="listRow"><b>${esc(m.date)}</b><div class="muted small" style="margin-top:5px">${Object.entries({weight:'体重',chest:'胸围',waist:'腰围',arm:'手臂',hip:'臀围',thigh:'大腿'}).filter(([k])=>m[k]!=null).map(([k,t])=>t+' '+m[k]+(k==='weight'?'kg':'cm')).join(' · ')}</div></div>`).join(''):'<div class="empty">还没有身体记录</div>'}</div><div class="card"><h2>营养目标</h2><label class="field">每日蛋白质目标（g）</label><input type="number" min="1" class="input" id="proteinTarget" value="${Number(data.proteinTarget)||130}"><button class="btn blue" style="margin-top:10px" onclick="saveProteinTarget()">保存目标</button></div><div class="card"><h2>训练提醒</h2><label class="field">提醒时间</label><input type="time" class="input" id="reminder" value="${esc(data.reminder||'19:00')}"><label class="field">训练日</label><div class="pillTabs" style="flex-wrap:wrap">${[['1','一'],['2','二'],['3','三'],['4','四'],['5','五'],['6','六'],['0','日']].map(([v,t])=>`<button class="${(data.trainingDays||[]).includes(Number(v))?'active':''}" onclick="toggleDay(${v})">周${t}</button>`).join('')}</div><button class="btn blue" onclick="saveReminder()">保存时间</button><p class="hint" style="margin:12px 0 0">目前只能保存提醒时间和训练日，尚不能保证 iPhone 关闭网页后自动通知。这需要后续安装通知服务。</p></div><div class="card"><h2>数据备份与恢复</h2><p class="small muted">目前记录只储存在本机浏览器。更新网页前建议先导出备份。</p><button class="btn blue full" onclick="exportData()">↓ 导出 JSON 备份</button><label class="field">导入备份（将覆盖现有数据）</label><input type="file" class="input" accept=".json,application/json" onchange="importData(this)"></div><div class="hint">HomeFit V3.2 · 移除了所有专属动态示范和 GIF。图片只是静态视觉参考，不会自动播放。</div>`}
function addMeasure(){let obj={date:dateToday()};['weight','chest','waist','arm','hip','thigh'].forEach(k=>{const v=$('m_'+k).value;if(v)obj[k]=Number(v)});if(Object.keys(obj).length===1){notify('请至少填写一项数据');return}data.measurements.push(obj);save();render();notify('身体数据已保存')}
function saveProteinTarget(){const v=Number($('proteinTarget').value);if(!Number.isFinite(v)||v<=0){notify('请输入正确目标');return}data.proteinTarget=v;save();render();notify('目标已保存')}
function toggleDay(day){let d=data.trainingDays||[];data.trainingDays=d.includes(day)?d.filter(x=>x!==day):[...d,day].sort((a,b)=>a-b);save();render()}
function saveReminder(){data.reminder=$('reminder').value;save();notify('提醒设置已保存')}
function exportData(){const content=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(content),a=document.createElement('a');a.href=url;a.download='homefit-backup-'+dateToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function importData(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.workouts)||!Array.isArray(d.food)||!Array.isArray(d.measurements))throw Error('format');if(!confirm('导入会覆盖目前的数据，确定继续吗？'))return;data={...DEF,...d};save();render();notify('备份已恢复')}catch{notify('备份格式不正确')}};r.readAsText(f)}
render();
</script></body></html>
